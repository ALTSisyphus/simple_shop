{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}Skystore{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="{% static 'catalog/css/styles.css' %}"
        rel="stylesheet"
    >
</head>

<body class="d-flex flex-column min-vh-100 bg-light">
<header class="bg-white border-bottom shadow-sm">
    <div class="container py-3">
        {% include "catalog/includes/menu.html" %}
    </div>
</header>

<main class="flex-grow-1">
    {% block content %}
    {% endblock %}
</main>

<footer class="mt-5 border-top bg-white">
    <div
        class="container py-4 d-flex flex-column flex-md-row justify-content-between gap-2"
    >
        <span class="fw-semibold">
            Skystore
        </span>

        <small class="text-muted">
            Учебный интернет-магазин &copy; 2026
        </small>
    </div>
</footer>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>
</body>
</html>
