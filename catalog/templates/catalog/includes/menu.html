<nav class="navbar navbar-expand-md p-0" aria-label="Главное меню">
    <a class="navbar-brand fw-bold" href="{% url 'catalog:home' %}">
        Skystore
    </a>

    <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainMenu"
        aria-controls="mainMenu"
        aria-expanded="false"
        aria-label="Открыть меню"
    >
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainMenu">
        <div class="navbar-nav ms-auto gap-md-2 mt-3 mt-md-0 align-items-md-center">
            <a class="nav-link" href="{% url 'catalog:home' %}">Главная</a>
            <a class="nav-link" href="{% url 'blog:blog_list' %}">Блог</a>
            <a class="nav-link" href="{% url 'catalog:contacts' %}">Контакты</a>

            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'catalog:product_create' %}">
                    Добавить товар
                </a>
                <a class="nav-link" href="{% url 'blog:blog_create' %}">
                    Создать статью
                </a>
                <a class="nav-link" href="{% url 'users:profile' %}">
                    {{ user.email }}
                </a>
                <form method="post" action="{% url 'users:logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-outline-secondary btn-sm" type="submit">
                        Выйти
                    </button>
                </form>
            {% else %}
                <a class="nav-link" href="{% url 'users:login' %}">Войти</a>
                <a class="btn btn-primary btn-sm" href="{% url 'users:register' %}">
                    Регистрация
                </a>
            {% endif %}
        </div>
    </div>
</nav>
